line-length = 120
target-version = "py310"
extend-exclude = ["app.py", "utils"]

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.per-file-ignores]
"security/injection_guard.py" = ["E501"]  # long regular expressions
"tests/*" = ["E501"]
"scripts/*" = ["E402"]  # scripts add the project root to sys.path before importing the app
